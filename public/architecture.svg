<rect x="27" y="232" width="226" height="7" rx="3" fill="#087dfa"/>
<text x="40" y="273" font-size="27" font-weight="700" fill="#090d3b" style="fill:#090d3b">Student</text>
<text x="40" y="310" font-size="26" font-weight="400" fill="#193269" style="fill:#193269">Browser user</text>
<line x1="140" y1="326" x2="140" y2="1474" stroke="#97aac1" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="287" y="232" width="226" height="94" rx="16" fill="#edf7ff" stroke="#d7e7f5" stroke-width="2"/>
