<text x="820" y="273" font-size="27" font-weight="700" fill="#090d3b" style="fill:#090d3b">Anthropic SDK</text>
<text x="820" y="310" font-size="26" font-weight="400" fill="#193269" style="fill:#193269">Server-side client</text>
<line x1="920" y1="326" x2="920" y2="1474" stroke="#97aac1" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="1067" y="232" width="226" height="94" rx="16" fill="#eaf8f1" stroke="#d7e7f5" stroke-width="2"/>
<rect x="1067" y="232" width="226" height="7" rx="3" fill="#00865d"/>
