<text x="300" y="310" font-size="26" font-weight="400" fill="#193269" style="fill:#193269">public/app.js</text>
<line x1="400" y1="326" x2="400" y2="1474" stroke="#97aac1" stroke-width="2" stroke-dasharray="7 7"/>
