<rect x="547" y="232" width="226" height="7" rx="3" fill="#853df2"/>
<text x="560" y="273" font-size="27" font-weight="700" fill="#090d3b" style="fill:#090d3b">Node.js host</text>
<text x="560" y="310" font-size="26" font-weight="400" fill="#193269" style="fill:#193269">server.js</text>
<line x1="660" y1="326" x2="660" y2="1474" stroke="#97aac1" stroke-width="2" stroke-dasharray="7 7"/>
<rect x="807" y="232" width="226" height="94" rx="16" fill="#f3edff" stroke="#d7e7f5" stroke-width="2"/>
